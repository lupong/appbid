[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appbid-plus"
version = "0.1.0"
description = "Reverse-auction marketplace for auto loan bid requests"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrew Pongco" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "cdp-sdk>=1.44.0",
    "x402>=2.9.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "marketplace", "agents", "data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]
